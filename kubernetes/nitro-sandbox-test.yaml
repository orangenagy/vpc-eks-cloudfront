# A pod running in its own Nitro Sandbox microVM.
# Check it: kubectl exec sandbox-test -- uname -r   (guest kernel, not the node's)
apiVersion: v1
kind: Pod
metadata:
  name: sandbox-test
spec:
  runtimeClassName: isolated-sandbox
  containers:
    - name: main
      image: public.ecr.aws/amazonlinux/amazonlinux:2023 # multi-arch, runs on Graviton
      command: ["sleep", "infinity"]
      resources:
        limits:
          cpu: "1"
          memory: 512Mi
