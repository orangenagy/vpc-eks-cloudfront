# Nitro Sandbox RuntimeClasses, from the EKS User Guide. Apply once per cluster
# on regular EKS (Auto Mode ships these already).
# Pods opt in with `runtimeClassName: isolated-sandbox`.
apiVersion: node.k8s.io/v1
kind: RuntimeClass
metadata:
  name: isolated-sandbox
handler: isolated-sandbox
overhead:
  podFixed:
    memory: 256Mi
    eks.amazonaws.com/nitro-sandbox: "1"
scheduling:
  nodeSelector:
    eks.amazonaws.com/nitro-sandbox: "true"
---
apiVersion: node.k8s.io/v1
kind: RuntimeClass
metadata:
  name: confidential-sandbox
handler: confidential-sandbox
overhead:
  podFixed:
    memory: 512Mi
    eks.amazonaws.com/nitro-sandbox: "1"
scheduling:
  nodeSelector:
    eks.amazonaws.com/nitro-sandbox: "true"
